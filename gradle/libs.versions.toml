[versions]
agp = "9.5.0"
coroutines = "1.11.0"
junit = "4.13.2"
kotest = "6.2.6"
# The compiler for AGP's built-in Kotlin.
kotlin = "2.2.10"
ktfmt = "0.65"
okio = "3.18.2"
serialization = "1.9.0"
spotless = "8.11.0"

[libraries]
junit = { group = "junit", name = "junit", version.ref = "junit" }
kotest-assertions = { group = "io.kotest", name = "kotest-assertions-core", version.ref = "kotest" }
kotest-assertions-json = { group = "io.kotest", name = "kotest-assertions-json", version.ref = "kotest" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
# Included to be picked up by dependency update automation. Spotless runs ktfmt.
ktfmt = { group = "org.jetbrains.kotlinx", name = "ktfmt", version.ref = "ktfmt" }
okio = { group = "com.squareup.okio", name = "okio", version.ref = "okio" }

[plugins]
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
