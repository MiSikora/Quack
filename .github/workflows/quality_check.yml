name: Quality Check
on:
  pull_request:
    paths-ignore:
      - "**.md"
  push:
    branches:
      - trunk

jobs:
  gradle_wrapper_validation:
    name: Gradle Wrapper Validation
    uses: ./.github/workflows/gradle_wrapper_validation.yml

  tests:
    if: ${{ github.repository == 'MiSikora/Quack' }}
    name: JVM Tests
    runs-on: ubuntu-latest
    needs: gradle_wrapper_validation
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1

      - name: Set Up JDK
        uses: actions/setup-java@v6.3.0
        with:
          distribution: zulu
          java-version: 25

      - name: Cache Gradle Directories
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.gradle/caches/
            ~/.gradle/wrapper/
          key: cache-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: cache-gradle-

      - name: Run Tests
        run: ./gradlew test assembleAndroidTest --stacktrace

      - name: Stop Gradle
        run: ./gradlew --stop

  instrumented-tests:
    if: ${{ github.repository == 'MiSikora/Quack' }}
    name: Instrumented Tests (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    needs: gradle_wrapper_validation
    strategy:
      fail-fast: false
      matrix:
        api-level: [28, 36]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1

      - name: Set Up JDK
        uses: actions/setup-java@v6.3.0
        with:
          distribution: zulu
          java-version: 25

      - name: Cache Gradle Directories
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.gradle/caches/
            ~/.gradle/wrapper/
          key: cache-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: cache-gradle-

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Instrumented Tests
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --stacktrace

      - name: Upload Test Reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: instrumented-test-reports-api-${{ matrix.api-level }}
          path: quack/build/reports/androidTests/

      - name: Stop Gradle
        run: ./gradlew --stop

  spotless:
    if: ${{ github.repository == 'MiSikora/Quack' }}
    name: Spotless Check
    runs-on: ubuntu-latest
    needs: gradle_wrapper_validation
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1

      - name: Set Up JDK
        uses: actions/setup-java@v6.3.0
        with:
          distribution: zulu
          java-version: 25

      - name: Cache Gradle Directories
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.gradle/caches/
            ~/.gradle/wrapper/
          key: cache-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: cache-gradle-

      - name: Run Spotless Check
        run: ./gradlew spotlessCheck --stacktrace

      - name: Stop Gradle
        run: ./gradlew --stop

  lint:
    if: ${{ github.repository == 'MiSikora/Quack' }}
    name: Android Lint
    runs-on: ubuntu-latest
    needs: gradle_wrapper_validation
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1

      - name: Set Up JDK
        uses: actions/setup-java@v6.3.0
        with:
          distribution: zulu
          java-version: 25

      - name: Cache Gradle Directories
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.gradle/caches/
            ~/.gradle/wrapper/
          key: cache-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: cache-gradle-

      - name: Run Lint
        run: ./gradlew lint --stacktrace

      - name: Stop Gradle
        run: ./gradlew --stop

  cli:
    if: ${{ github.repository == 'MiSikora/Quack' }}
    name: CLI Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./cli
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1

      - name: Set Up Go
        uses: actions/setup-go@v7.1.0
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Check Formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Run Vet
        run: go vet ./...

      - name: Run Tests
        run: go test ./...
