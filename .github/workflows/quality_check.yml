name: Quality Check
on:
  workflow_call:
  pull_request:
    paths-ignore:
      - "**.md"
  push:
    branches:
      - trunk

jobs:
  gradle_wrapper_validation:
    name: Gradle Wrapper Validation
    uses: ./.github/workflows/gradle_wrapper_validation.yml

  tests:
    if: ${{ github.repository == 'MiSikora/Quack' }}
    name: JVM Tests
    runs-on: ubuntu-latest
    needs: gradle_wrapper_validation
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1

      - name: Set Up JDK
        uses: actions/setup-java@v6.3.0
        with:
          distribution: zulu
          java-version: 25

      - name: Cache Gradle Directories
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.gradle/caches/
            ~/.gradle/wrapper/
          key: cache-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: cache-gradle-

      - name: Run Tests
        run: ./gradlew test --stacktrace

      - name: Stop Gradle
        run: ./gradlew --stop

  spotless:
    if: ${{ github.repository == 'MiSikora/Quack' }}
    name: Spotless Check
    runs-on: ubuntu-latest
    needs: gradle_wrapper_validation
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1

      - name: Set Up JDK
        uses: actions/setup-java@v6.3.0
        with:
          distribution: zulu
          java-version: 25

      - name: Cache Gradle Directories
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.gradle/caches/
            ~/.gradle/wrapper/
          key: cache-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: cache-gradle-

      - name: Run Spotless Check
        run: ./gradlew spotlessCheck --stacktrace

      - name: Stop Gradle
        run: ./gradlew --stop

  lint:
    if: ${{ github.repository == 'MiSikora/Quack' }}
    name: Android Lint
    runs-on: ubuntu-latest
    needs: gradle_wrapper_validation
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1

      - name: Set Up JDK
        uses: actions/setup-java@v6.3.0
        with:
          distribution: zulu
          java-version: 25

      - name: Cache Gradle Directories
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.gradle/caches/
            ~/.gradle/wrapper/
          key: cache-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: cache-gradle-

      - name: Run Lint
        run: ./gradlew lint --stacktrace

      - name: Stop Gradle
        run: ./gradlew --stop

  cli:
    if: ${{ github.repository == 'MiSikora/Quack' }}
    name: CLI Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./cli
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1

      - name: Set Up Go
        uses: actions/setup-go@v7.1.0
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Check Formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Run Vet
        run: go vet ./...

      - name: Run Tests
        run: go test ./...
