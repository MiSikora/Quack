name: Release
on:
  push:
    tags:
      - "*.*.*"

jobs:
  check-version:
    if: ${{ github.repository == 'MiSikora/Quack' }}
    name: Check Version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1

      - name: Match Tag With Version Name
        run: |
          version=$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)
          if [[ "$version" != "$GITHUB_REF_NAME" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION_NAME $version."
            exit 1
          fi

  quality_check:
    name: Quality Check
    needs: check-version
    uses: ./.github/workflows/quality_check.yml

  publish-library:
    if: ${{ github.repository == 'MiSikora/Quack' }}
    name: Publish Library
    runs-on: ubuntu-latest
    needs: quality_check
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1

      - name: Set Up JDK
        uses: actions/setup-java@v6.3.0
        with:
          distribution: zulu
          java-version: 25

      - name: Cache Gradle Directories
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.gradle/caches/
            ~/.gradle/wrapper/
          key: cache-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: cache-gradle-

      - name: Deploy Release
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.SONATYPE_NEXUS_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.SONATYPE_NEXUS_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SONATYPE_NEXUS_SIGNING_KEY }}
        run: ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache --stacktrace

      - name: Stop Gradle
        run: ./gradlew --stop

      - name: Upload Library
        uses: actions/upload-artifact@v7.0.2
        with:
          name: library
          path: quack/build/outputs/aar/*.aar
          if-no-files-found: error

  build-cli:
    if: ${{ github.repository == 'MiSikora/Quack' }}
    name: Build CLI
    # lipo, which makes the universal macOS binaries, needs macOS.
    runs-on: macos-latest
    needs: quality_check
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1

      - name: Set Up Go
        uses: actions/setup-go@v7.1.0
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Build CLI
        run: ./scripts/build_cli.sh

      - name: Upload CLI
        uses: actions/upload-artifact@v7.0.2
        with:
          name: cli
          path: cli/build/dist/*.tar.gz
          if-no-files-found: error

  github-release:
    if: ${{ github.repository == 'MiSikora/Quack' }}
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [publish-library, build-cli]
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1

      - name: Download Artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Extract Release Notes
        id: extract-release-notes
        uses: ffurrer2/extract-release-notes@v3.1.0
        with:
          changelog_file: ./CHANGELOG.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.4
        with:
          body: ${{ steps.extract-release-notes.outputs.release_notes }}
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  bump-formulae:
    if: ${{ github.repository == 'MiSikora/Quack' }}
    name: Bump Homebrew Formulae
    runs-on: ubuntu-latest
    needs: github-release
    permissions:
      contents: read
    steps:
      # The action downloads each archive from the GitHub Release to compute its checksum, and commits to the tap.
      - name: Bump quack
        uses: mislav/bump-homebrew-formula-action@v4.2
        with:
          formula-name: quack
          homebrew-tap: MiSikora/homebrew-tap
          base-branch: trunk
          download-url: https://github.com/MiSikora/Quack/releases/download/${{ github.ref_name }}/quack-${{ github.ref_name }}-macos.tar.gz
          commit-message: "{{formulaName}} {{version}}"
        env:
          COMMITTER_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Bump quack-mcp
        uses: mislav/bump-homebrew-formula-action@v4.2
        with:
          formula-name: quack-mcp
          homebrew-tap: MiSikora/homebrew-tap
          base-branch: trunk
          download-url: https://github.com/MiSikora/Quack/releases/download/${{ github.ref_name }}/quack-mcp-${{ github.ref_name }}-macos.tar.gz
          commit-message: "{{formulaName}} {{version}}"
        env:
          COMMITTER_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
